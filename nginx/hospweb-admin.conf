# หลังบ้าน Directus: https://waritch-hosp.moph.go.th:8443  (เข้าได้จากเครือข่ายโรงพยาบาลเท่านั้น)
# วางที่ /etc/nginx/conf.d/hospweb-admin.conf
#
# ป้องกัน 3 ชั้น: (1) router ไม่ forward พอร์ต 8443 และ firewalld เปิด 8443 ให้เฉพาะ LAN
#                (2) allow/deny ด้านล่าง  (3) ip_access + 2FA ใน policy ของ Directus
server {
    listen 8443 ssl http2;   # nginx 1.25.1 ขึ้นไป เปลี่ยนเป็น "listen 8443 ssl;" + "http2 on;"
    server_name waritch-hosp.moph.go.th;

    # ใช้ใบรับรอง *.moph.go.th ชุดเดียวกับเว็บหลัก (path ตาม conf.d/waritch.conf หลังรัน phase0)
    ssl_certificate     /etc/nginx/ssl/moph.go.th/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/moph.go.th/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:hospweb_admin:5m;

    # router ทำ NAT ให้คนนอกบางส่วนเห็นเป็น 192.168.1.1 (ดูจาก access.log ตอนเฟส 0) จึงต้อง deny ไว้ก่อน
    deny  192.168.1.1;
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 127.0.0.1;
    deny  all;

    client_max_body_size 20m;
    server_tokens off;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/hospweb-admin.access.log;
    error_log  /var/log/nginx/hospweb-admin.error.log;

    location = /auth/login {
        limit_req zone=hospweb_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/hospweb-proxy.conf;
    }

    # ตัวอย่างหน้าเว็บที่รวมฉบับร่าง (static build แยก สร้างโดย scripts/build-site.sh)
    # ปุ่ม "ดูตัวอย่าง" ในหลังบ้านเปิดหน้านี้
    location ^~ /preview/ {
        alias /srv/hospweb/preview/current/;
        index index.html;
        error_page 404 /preview/404.html;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; frame-src https://www.google.com https://www.facebook.com https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        location ~ \.php$ { return 404; }
    }

    location / {
        include /etc/nginx/snippets/hospweb-proxy.conf;
    }
}
