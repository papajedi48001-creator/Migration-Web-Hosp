# หน้าเว็บสาธารณะใหม่ (ไฟล์ static จาก Astro)
# ใช้ตอน cut-over: include ไฟล์นี้ใน server {} เดิมของ waritch-hosp.moph.go.th (conf.d/waritch.conf)
# แทนส่วนที่ส่ง / ไปให้ WordPress  ส่วน location ของแอปเดิม (/waritch/, /iclaim/, /ita67/, /dispensingx/ ฯลฯ)
# และ snippets/phase0.conf ให้คงไว้เหมือนเดิม  location ที่ยาวกว่าจะชนะ location / นี้เอง
#
#   include /etc/nginx/snippets/hospweb-public.conf;

# ลิงก์เดิมของ WordPress
if ($hospweb_redirect)        { return 301 $hospweb_redirect; }
if ($hospweb_redirect_p)      { return 301 $hospweb_redirect_p; }
if ($hospweb_redirect_pageid) { return 301 $hospweb_redirect_pageid; }

# หน้า login/admin ของ WordPress เดิมที่ root ปิดถาวร (ITA67 ฯลฯ ที่ path ของตัวเองไม่กระทบ)
location = /wp-login.php { return 410; }
location = /xmlrpc.php   { return 410; }
location ^~ /wp-admin/   { return 410; }
# รูปเก่าที่เว็บอื่นอาจลิงก์ไว้: เก็บสำเนา wp-content/uploads แบบ read-only ไว้ระยะหนึ่ง ห้ามรัน PHP
location ^~ /wp-content/uploads/ {
    root /srv/hospweb/legacy;
    location ~ \.php$ { return 404; }
}

location / {
    root /srv/hospweb/site/current;
    index index.html;
    try_files $uri $uri/ =404;
    error_page 404 /404.html;
    include /etc/nginx/snippets/hospweb-headers.conf;
    # HTML และไฟล์ค้นหาตรวจกับ server ทุกครั้ง (ข่าวใหม่ขึ้นทันทีหลัง build)
    add_header Cache-Control "no-cache" always;

    # ไฟล์ที่ชื่อมีรหัสเวอร์ชัน เปลี่ยนเนื้อหาเมื่อไรชื่อก็เปลี่ยน จึง cache ได้นาน
    location ^~ /_astro/ {
        include /etc/nginx/snippets/hospweb-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /media/ {
        include /etc/nginx/snippets/hospweb-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    # ไม่มี PHP ในเว็บใหม่เลย ใครเรียก .php ที่ root ถือว่าไม่พบ
    location ~ \.php$ { return 404; }
}
