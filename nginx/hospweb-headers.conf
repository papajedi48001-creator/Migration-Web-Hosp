# header ความปลอดภัยของหน้าเว็บสาธารณะ (static) วางที่ /etc/nginx/snippets/hospweb-headers.conf
# nginx ไม่สืบทอด add_header เข้า location ย่อยที่มี add_header ของตัวเอง จึงต้อง include ทุกที่ที่ใช้
# 'wasm-unsafe-eval' จำเป็นสำหรับระบบค้นหา (Pagefind ใช้ WebAssembly) ไม่เปิดให้รัน eval ของ JavaScript
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; frame-src https://www.google.com https://www.facebook.com https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
