# วางที่ /etc/nginx/conf.d/00-hospweb-maps.conf (อยู่ใน http {} อัตโนมัติ)
# ลิงก์เดิมของ WordPress -> ลิงก์ใหม่ (ไฟล์ map สร้างจาก migration/wp-to-directus.mjs)
# ลิงก์ภาษาไทยยาว ต้องขยาย bucket
map_hash_bucket_size 256;
map_hash_max_size 8192;

map $uri $hospweb_redirect {
    default "";
    include /srv/hospweb/redirects/redirects.map;
}
map $arg_p $hospweb_redirect_p {
    default "";
    include /srv/hospweb/redirects/redirects-p.map;
}
map $arg_page_id $hospweb_redirect_pageid {
    default "";
    include /srv/hospweb/redirects/redirects-p.map;
}

# จำกัดการลองรหัสผ่านที่หน้า login หลังบ้าน (เสริมจากที่ Directus ล็อกบัญชีเองหลังผิด 5 ครั้ง)
limit_req_zone $binary_remote_addr zone=hospweb_login:10m rate=5r/m;
